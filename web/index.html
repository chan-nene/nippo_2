                <div class="settings-section-body">
                  <div class="settings-field settings-control-field">
                    <div id="colorPaletteSettingTitle" class="settings-field-label">カラーパレット</div>
                    <div
                      id="colorPaletteOptions"
                      class="color-palette-options"
                      role="radiogroup"
                      aria-labelledby="colorPaletteSettingTitle"
                    >
                      <label class="color-palette-option">
                        <input
                          id="colorPaletteBlueWhite"
                          type="radio"
                          name="colorPalette"
                          value="blue_white"
                          data-color-palette-option
                        />
                        <span class="color-palette-preview is-blue-white" aria-hidden="true">
                          <span></span><span></span><span></span>
                        </span>
                        <span>ブルー1</span>
                      </label>
                      <label class="color-palette-option">
                        <input
                          id="colorPaletteBlue"
                          type="radio"
                          name="colorPalette"
                          value="blue"
                          data-color-palette-option
                          checked
                        />
                        <span class="color-palette-preview is-blue" aria-hidden="true">
                          <span></span><span></span><span></span>
                        </span>
                        <span>ブルー2</span>
                      </label>
                      <label class="color-palette-option">
                        <input
                          id="colorPaletteDefault"
                          type="radio"
                          name="colorPalette"
                          value="default"
                          data-color-palette-option
                        />
                        <span class="color-palette-preview is-default" aria-hidden="true">
                          <span></span><span></span><span></span>
                        </span>
                        <span>グレー</span>
                      </label>
                    </div>
                  </div>
                  <div class="settings-field settings-control-field">
                    <div id="appearanceModeSettingTitle" class="settings-field-label">表示モード</div>
                    <div
                      id="appearanceModeOptions"
                      class="appearance-mode-options"
                      role="radiogroup"
                      aria-labelledby="appearanceModeSettingTitle"
                    >
                      <label class="appearance-mode-option">
                        <input
                          id="appearanceModeLight"
                          type="radio"
                          name="appearanceMode"
                          value="light"
                          data-theme-setting-option
                          checked
                        />
                        <span class="appearance-mode-preview is-light" aria-hidden="true"><span></span></span>
                        <span>ライト</span>
                      </label>
                      <label class="appearance-mode-option">
                        <input
                          id="appearanceModeDark"
                          type="radio"
                          name="appearanceMode"
                          value="dark"
                          data-theme-setting-option
                        />
                        <span class="appearance-mode-preview is-dark" aria-hidden="true"><span></span></span>
                        <span>ダーク</span>
                      </label>
                    </div>
                  </div>
                </div>
              </section>
              <section id="settingsFeaturePanel" class="settings-section" aria-labelledby="settingsFeatureTitle">
                <h2 id="settingsFeatureTitle">機能</h2>
                <div class="settings-section-body">
                  <div class="settings-field settings-control-field">
                    <div class="settings-field-label">直近ボタンの表示範囲</div>
                    <div class="default-range-selects">
                      <!--<span>本日を起点に</span>-->
                      <label>
                        <select id="defaultStartOffsetDays" aria-label="表示範囲の開始日">
                          <option value="5">5稼働日前</option>
                          <option value="4">4稼働日前</option>
                          <option value="3">3稼働日前</option>
                          <option value="2">2稼働日前</option>
                          <option value="1">1稼働日前</option>
                          <option value="0">本日</option>
                        </select>
                      </label>
                      <span>～</span>
                      <label>
                        <select id="defaultEndOffsetDays" aria-label="表示範囲の終了日">
                          <option value="0">本日</option>
                          <option value="1">1稼働日後</option>
                          <option value="2">2稼働日後</option>
                          <option value="3">3稼働日後</option>
                          <option value="4">4稼働日後</option>
                          <option value="5">5稼働日後</option>
                        </select>
                      </label>
                      <!--<span>の範囲を表示</span>-->
                    </div>
                  </div>
                  <div class="settings-field settings-control-field">
                    <div id="memberFilterSettingTitle" class="settings-field-label">フィルタボタン</div>
                    <div
                      id="memberFilterOptions"
                      class="member-filter-options"
                      role="group"
                      aria-labelledby="memberFilterSettingTitle"
                    >
                      <label class="member-filter-option">
                        <input id="memberFilterDepartment" type="checkbox" value="department" data-member-filter-level />
                        <span>係</span>
                      </label>
                      <label class="member-filter-option">
                        <input id="memberFilterSection" type="checkbox" value="section" data-member-filter-level />
                        <span>チーム</span>
                      </label>
                      <label class="member-filter-option">
                        <input id="memberFilterMember" type="checkbox" value="member" data-member-filter-level />
                        <span>個人</span>
                      </label>
                    </div>
                  </div>
                  <div id="commentFeatureSettings" class="settings-section-body">
                    <label class="settings-field settings-signature-field">
                      <span>サインボタン押下時に入力する文字 <span class="settings-inline-note">（空欄の場合は名前が入力されます）</span></span>
                      <input
                        id="commentSignature"
                        type="text"
                        maxlength="100"
                        autocomplete="off"
                      />
                    </label>
                    <div class="settings-field settings-date-field">
                      <label class="settings-field-label" for="missingCommentStartDate">未コメントの集計開始日</label>
                      <div class="settings-missing-controls">
                        <div class="period-field-group flatpickr-date-field">
                          <input id="missingCommentStartDate" type="date" aria-label="未コメントの集計開始日" />
                          <svg class="period-field-display-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="4" y="5" width="16" height="15" rx="2" />
                            <path d="M8 3v4M16 3v4M4 10h16" />
                          </svg>
                        </div>
                        <label class="settings-check-option">
                          <input id="includeTodayInMissingComments" type="checkbox" />
                          <span class="settings-check-copy">当日の日報を未コメントの表示対象にする<span class="settings-check-note">当日の日報を夜に確認する方はチェックしてください</span></span>
                        </label>
                        <label class="settings-check-option">
                          <input id="includeEmptyReportDaysInMissingComments" type="checkbox" checked />
                          <span class="settings-check-copy">空欄の日報を未コメントの表示対象にする<span class="settings-check-note">空欄の日報にもサインする方はチェックしてください</span></span>
                        </label>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
              <div class="settings-section-actions">
                <button
                  id="settingsReloadButton"
                  class="toolbar-button data-refresh-button"
                  type="button"
                  aria-label="最新データを取得"
                  title="最新データを取得"
                >
                  <span class="toolbar-button-icon" aria-hidden="true">
                    <svg class="is-refresh-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M4.5 2.5a1 1 0 0 1 1 1v1.572A9.5 9.5 0 1 1 12 21.5c-4.87 0-8.882-3.663-9.435-8.384a1 1 0 0 1 1.986-.232A7.501 7.501 0 0 0 19.5 12 7.5 7.5 0 0 0 6.41 7H9a1 1 0 0 1 0 2H4.5a1 1 0 0 1-1-1.024V3.5a1 1 0 0 1 1-1Z" clip-rule="evenodd" /></svg>
                  </span>
                </button>
                <button
                  id="saveSettingsButton"
                  class="toolbar-button primary"
                  type="button"
                >
                  保存
                  <span class="save-pending-indicator hidden" aria-hidden="true"></span>
                </button>
              </div>
              <p id="settingsSaveError" class="settings-save-error hidden" role="alert"></p>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog
      id="actionConfirmDialog"
      class="confirmation-dialog"
      aria-labelledby="actionConfirmDialogTitle"
      aria-describedby="actionConfirmDialogDescription"
    >
      <div class="confirmation-dialog-content">
        <h2 id="actionConfirmDialogTitle">確認</h2>
        <p id="actionConfirmDialogDescription"></p>
        <div class="confirmation-dialog-actions">
          <button id="cancelActionConfirmButton" class="dialog-button" type="button">
            このまま編集を続ける
          </button>
          <button id="confirmActionConfirmButton" class="dialog-button danger" type="button">
            実行する
          </button>
        </div>
      </div>
    </dialog>

    <dialog
      id="teamCreateDialog"
      class="team-create-dialog"
      aria-labelledby="teamCreateDialogTitle"
    >
      <form id="teamCreateForm" class="team-create-dialog-content">
        <h2 id="teamCreateDialogTitle">係を追加</h2>
        <input id="teamCreateLevel" data-team-create-level type="hidden" value="department" />
        <label class="inspector-field">
          <span class="inspector-field-label"><span id="teamCreateNameLabel">係名</span></span>
          <input id="teamCreateName" data-team-create-name type="text" required autocomplete="off" />
          <span id="teamCreateNameError" class="inspector-field-error hidden" role="alert"></span>
        </label>
        <div class="user-editor-actions team-create-actions">
          <button id="cancelTeamCreateButton" class="inspector-cancel-button" type="button">キャンセル</button>
          <button id="confirmTeamCreateButton" class="inspector-save-button" type="submit">作成</button>
        </div>
      </form>
    </dialog>

    <script src="reports.js?v=20261027-01"></script>
    <script src="conversations.js?v=20261026-01"></script>
    <script src="settings.js?v=20260919-02"></script>
    <script src="vendor/Sortable.min.js?v=20260830-18"></script>
    <script src="admin.js?v=20260904-02"></script>
    <script src="app.js?v=20261026-01"></script>
